plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'checkstyle'
}

// 多版本构建：产物名带 Minecraft 版本后缀，如 my-bot-mod-1.3.2+1.20.4.jar
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	// 子项目名为 MC 版本号，需显式指定产物基名
	archivesName = project.archives_base_name
}

repositories {
	// Loom 自动添加 Minecraft/Fabric 仓库；mavenCentral 供 Checkstyle 等工具解析。
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"my-bot-mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// 各版本子项目共用根目录 run/（复用已有存档与配置）
	runConfigs.configureEach {
		runDir "../../run"
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Testing
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

// 确保 test 源集可访问 main 的编译输出及 Minecraft 类
sourceSets {
	test {
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}
}

processResources {
	def version = project.version
	def mcDep = project.mc_dep
	// 1.20.5+ 需 Java 21；1.20.1–1.20.4 为 Java 17
	def javaDep = ['1.20.1', '1.20.2', '1.20.4'].contains(project.minecraft_version) ? '>=17' : '>=21'
	inputs.property "version", version
	inputs.property "mc_dep", mcDep
	inputs.property "java_dep", javaDep

	filesMatching("fabric.mod.json") {
		expand "version": version, "mc_dep": mcDep, "java_dep": javaDep
	}
}

// 1.20.5+ 需 Java 21；1.20.1–1.20.4 保持 Java 17
def javaRelease = ['1.20.1', '1.20.2', '1.20.4'].contains(project.minecraft_version) ? 17 : 21

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaRelease
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = javaRelease == 17 ? JavaVersion.VERSION_17 : JavaVersion.VERSION_21
	targetCompatibility = javaRelease == 17 ? JavaVersion.VERSION_17 : JavaVersion.VERSION_21
}

// 静态检查：违规将阻断构建（CI 质量门控）
checkstyle {
	toolVersion = '10.12.4'
	ignoreFailures = false
	maxWarnings = Integer.MAX_VALUE
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
