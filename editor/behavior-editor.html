<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>My Bot Mod · Behavior Editor 行为编辑器</title>
<style>
  :root {
    --bg:#0f1319; --panel:#171d26; --panel2:#1d2531; --border:#2a3546;
    --accent:#22d3ee; --accent-dim:#0e7490; --text:#e6edf3; --muted:#7d8b9f;
    --danger:#f87171; --ok:#4ade80; --radius:10px;
    --font:-apple-system,"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",Roboto,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:var(--font); overflow:hidden; }

  /* ===== 顶栏 ===== */
  #topbar { display:flex; align-items:center; gap:10px; padding:0 14px; height:56px;
    background:linear-gradient(180deg, #1a2230 0%, #161d28 100%);
    border-bottom:1px solid var(--border); box-shadow:0 1px 12px rgba(0,0,0,.35); }
  .logo { display:flex; align-items:center; gap:8px; font-weight:700; font-size:14.5px;
    color:var(--accent); white-space:nowrap; letter-spacing:.2px; }
  .logo svg { width:22px; height:22px; }
  .field { display:flex; flex-direction:column; gap:1px; }
  .field label { font-size:9.5px; color:var(--muted); padding-left:2px; letter-spacing:.5px; }
  .field input[type=text] { background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:5px 10px; font-size:12.5px; outline:none; font-family:var(--font);
    transition:border-color .15s, box-shadow .15s; }
  .field input[type=text]:focus { border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(34,211,238,.15); }
  #bhName { width:150px; } #bhDesc { width:220px; }
  .grow { flex:1; }
  .divider { width:1px; height:26px; background:var(--border); margin:0 2px; }

  /* 开关（循环） */
  .switch { display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
  .switch input { display:none; }
  .switch .track { width:32px; height:18px; border-radius:9px; background:var(--border);
    position:relative; transition:background .15s; }
  .switch .track::after { content:''; position:absolute; top:2px; left:2px; width:14px; height:14px;
    border-radius:50%; background:var(--muted); transition:all .15s; }
  .switch input:checked + .track { background:var(--accent-dim); }
  .switch input:checked + .track::after { left:16px; background:var(--accent); }
  .switch span.lbl { font-size:12px; color:var(--muted); }

  /* 图标按钮 */
  .ibtn { display:flex; align-items:center; justify-content:center; width:34px; height:34px;
    border-radius:8px; border:1px solid transparent; background:transparent; color:var(--muted);
    cursor:pointer; transition:all .12s; position:relative; }
  .ibtn:hover { background:var(--panel2); color:var(--text); border-color:var(--border); }
  .ibtn:active { transform:scale(.94); }
  .ibtn svg { width:17px; height:17px; }
  .ibtn[data-tip]:hover::after { content:attr(data-tip); position:absolute; top:40px; left:50%;
    transform:translateX(-50%); background:#000c; color:#fff; font-size:11px; padding:4px 8px;
    border-radius:6px; white-space:nowrap; z-index:99; pointer-events:none; }
  .btn-save { display:flex; align-items:center; gap:6px; height:34px; padding:0 16px;
    border-radius:8px; border:none; cursor:pointer; font-size:13px; font-weight:600;
    font-family:var(--font); color:#04252b;
    background:linear-gradient(135deg, #22d3ee, #34e3b0); transition:all .15s; }
  .btn-save:hover { filter:brightness(1.12); box-shadow:0 2px 14px rgba(34,211,238,.35); }
  .btn-save:active { transform:scale(.97); }
  .btn-save svg { width:15px; height:15px; }

  /* ===== 工作区与状态栏 ===== */
  #blocklyDiv { position:absolute; top:56px; bottom:28px; left:0; right:0; }
  #statusbar { position:absolute; bottom:0; left:0; right:0; height:28px; display:flex;
    align-items:center; gap:12px; padding:0 14px; font-size:11.5px; color:var(--muted);
    background:var(--panel); border-top:1px solid var(--border); }
  #statusMsg { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #statusbar.ok #statusMsg { color:var(--ok); }
  #statusbar.err #statusMsg { color:var(--danger); }
  #blockCount { background:var(--panel2); border:1px solid var(--border); border-radius:999px;
    padding:1px 10px; font-size:10.5px; white-space:nowrap; }

  /* ===== Blockly 皮肤打磨 ===== */
  .blocklyToolboxDiv { background:var(--panel) !important; border-right:1px solid var(--border);
    padding-top:6px; width:130px !important; }
  .blocklyTreeRow { height:30px !important; line-height:30px !important; margin:2px 6px;
    border-radius:8px; padding-left:8px !important; transition:background .12s; }
  .blocklyTreeRow:hover { background:var(--panel2) !important; }
  .blocklyTreeRowContentContainer { display:flex; align-items:center; }
  .blocklyTreeLabel { font-family:var(--font) !important; font-size:12.5px !important;
    color:var(--text) !important; }
  .blocklyTreeSelected { background:var(--panel2) !important;
    box-shadow:inset 3px 0 0 var(--accent); }
  .blocklyTreeIcon { display:none; }
  .blocklyFlyout { border-radius:0 12px 12px 0; }
  .blocklyScrollbarHandle { fill:#3a4557 !important; rx:3; }
  .blocklyZoom>image, .blocklyTrash>image { opacity:.55; transition:opacity .15s; }
  .blocklyZoom>image:hover, .blocklyTrash>image:hover { opacity:1; }
  .blocklyWidgetDiv .goog-menu, .blocklyDropDownDiv { font-family:var(--font) !important; }
  input[type=file] { display:none; }

  /* ===== 物品/实体选择器弹窗 ===== */
  #mcpMask { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:1000;
    display:none; align-items:center; justify-content:center; backdrop-filter:blur(2px); }
  #mcpMask.show { display:flex; }
  .mcp { width:min(680px,92vw); height:min(560px,88vh); background:var(--panel);
    border:1px solid var(--border); border-radius:14px; box-shadow:0 12px 48px rgba(0,0,0,.5);
    display:flex; flex-direction:column; overflow:hidden; }
  .mcp-hd { display:flex; align-items:center; gap:10px; padding:12px 14px;
    border-bottom:1px solid var(--border); background:linear-gradient(180deg,#1a2230,#161d28); }
  .mcp-hd .ttl { font-weight:700; font-size:14px; color:var(--accent); }
  .mcp-hd .x { margin-left:auto; cursor:pointer; color:var(--muted); font-size:20px;
    width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:7px; }
  .mcp-hd .x:hover { background:var(--panel2); color:var(--text); }
  .mcp-search { display:flex; gap:8px; padding:10px 14px; border-bottom:1px solid var(--border); }
  .mcp-search input { flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:7px 12px; font-size:13px; outline:none; font-family:var(--font); }
  .mcp-search input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(34,211,238,.15); }
  .mcp-body { flex:1; display:flex; min-height:0; }
  .mcp-cats { width:132px; border-right:1px solid var(--border); overflow-y:auto; padding:6px; flex-shrink:0; }
  .mcp-cat { display:flex; align-items:center; gap:7px; padding:7px 9px; border-radius:8px;
    cursor:pointer; font-size:12.5px; color:var(--muted); white-space:nowrap; }
  .mcp-cat:hover { background:var(--panel2); color:var(--text); }
  .mcp-cat.on { background:var(--panel2); color:var(--text); box-shadow:inset 3px 0 0 var(--accent); }
  .mcp-grid { flex:1; overflow-y:auto; padding:10px; display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); grid-auto-rows:min-content; gap:8px; align-content:start; }
  .mcp-cell { display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:9px;
    border:1px solid var(--border); background:var(--panel2); cursor:pointer; transition:all .1s; overflow:hidden; }
  .mcp-cell:hover { border-color:var(--accent); transform:translateY(-1px); }
  .mcp-cell.on { border-color:var(--accent); box-shadow:0 0 0 2px rgba(34,211,238,.25); }
  .mcp-ico { width:30px; height:30px; border-radius:6px; background:var(--bg); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:18px; line-height:1;
    border:1px solid var(--border); image-rendering:pixelated; }
  .mcp-ico img { width:26px; height:26px; image-rendering:pixelated; }
  .mcp-nm { display:flex; flex-direction:column; min-width:0; }
  .mcp-nm b { font-size:12.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mcp-nm span { font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mcp-ft { display:flex; align-items:center; gap:10px; padding:9px 14px; border-top:1px solid var(--border); font-size:12px; color:var(--muted); }
  .mcp-pg { display:flex; align-items:center; gap:6px; margin-left:auto; }
  .mcp-pg button { background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:7px; width:30px; height:26px; cursor:pointer; font-size:14px; }
  .mcp-pg button:disabled { opacity:.35; cursor:default; }
  .mcp-use { background:linear-gradient(135deg,#22d3ee,#34e3b0); color:#04252b; border:none;
    border-radius:7px; padding:5px 12px; font-weight:600; cursor:pointer; font-family:var(--font); font-size:12px; }
</style>
</head>

    ITEMS_RAW.forEach(function (e) { have[e[0]] = 1; });
    MC_ALL_ITEMS.forEach(function (p) {
      if (p[0] === 'air' || have[p[0]]) return;
      var zh = p[2] || p[1];
      ITEMS_RAW.push([p[0], zh, p[1]]);
      MC_NAME['minecraft:' + p[0]] = T(zh, p[1]);
    });
  }
  if (typeof MC_ALL_ENTITIES !== 'undefined') {
    var haveE = {};
    ENTS_RAW.forEach(function (e) { haveE[e[0]] = 1; });
    MC_ALL_ENTITIES.forEach(function (p) {
      if (haveE[p[0]]) return;
      var zhe = p[2] || p[1];
      ENTS_RAW.push([p[0], zhe, p[1]]);
      MC_NAME['minecraft:' + p[0]] = T(zhe, p[1]);
    });
  }
})();

<script>
// ==================== 自定义块定义 ====================
// 颜色：事件 55(金) 动作 45(黄) 移动 210(蓝) 感知 180(青) 容器 300(品红) 控制 25(橙) 输出 280(紫) 选择器 130(绿)
var C_EVT = 55, C_ACT = 45, C_MOVE = 210, C_SENSE = 180, C_BOX = 300, C_CTRL = 25, C_OUT = 280, C_PICK = 130;

function defBlock(name, json) {
  Blockly.Blocks[name] = { init: function () { this.jsonInit(json); } };
}
function stmt(json, colour) {
  json.previousStatement = null; json.nextStatement = null; json.colour = colour; return json;
}
function out(json, colour, type) {
  json.output = type || null; json.colour = colour; return json;
}

// ==================== 物品/实体选择器（分页分类弹窗 + 图标 + 自动补全） ====================
var MCP_PAGE_SIZE = 54;
var mcpState = { kind: 'item', cat: 'all', q: '', page: 0, current: '', cb: null };

/** 自定义字段：存储物品/实体 ID（字符串），显示本地化名称，点击弹出选择器 */
var FieldMcPicker = null;
if (typeof Blockly !== 'undefined' && Blockly.FieldTextInput) {
  FieldMcPicker = class extends Blockly.FieldTextInput {
    constructor(value, kind) {
      super(value == null ? '' : value);
      this.mcpKind_ = kind || 'item';
      this.SERIALIZABLE = true;
    }
    static fromJson(options) {
      return new FieldMcPicker(options['id'] || options['text'] || '', options['kind']);
    }
    // 点击不进入默认文本编辑，而是弹出选择器
    showEditor_() {
      var self = this;
      openPickerModal(this.mcpKind_, this.getValue(), function (id) { self.setValue(id); });
    }
    // 块上显示中文/英文名（值仍为 ID）
    getDisplayText_() {
      var v = this.getValue();
      return v ? mcDisplayName(v) : T('(未选)', '(none)');
    }
  };
  Blockly.fieldRegistry.register('field_mc_picker', FieldMcPicker);
}

function mcpFiltered() {
  var data = mcpState.kind === 'entity' ? ENTS_RAW : ITEMS_RAW;
  var q = mcpState.q.trim().toLowerCase();
  return data.filter(function (e) {
    if (mcpState.cat !== 'all' && mcCatOf(mcpState.kind, e[0]) !== mcpState.cat) return false;
    if (!q) return true;
    return e[0].indexOf(q) >= 0 || e[1].toLowerCase().indexOf(q) >= 0
      || (e[2] || '').toLowerCase().indexOf(q) >= 0 || ('minecraft:' + e[0]).indexOf(q) >= 0;
  });
}

// 图标：全部使用 emoji（个性 → 模式匹配 → 分类图标三级回退），不加载网络贴图，完全离线
function mcpIconInto(el, kind, bareId) {
  el.textContent = mcEmoji(kind, bareId);
}

function mcpRender() {
  var cats = mcpState.kind === 'entity' ? ENT_CATS : ITEM_CATS;
  // 分类栏
  var catBox = document.getElementById('mcpCats');
  catBox.innerHTML = '';
  cats.forEach(function (c) {
    var el = document.createElement('div');
    el.className = 'mcp-cat' + (c[0] === mcpState.cat ? ' on' : '');
    el.innerHTML = '<span>' + c[3] + '</span><span>' + T(c[1], c[2]) + '</span>';
    el.onclick = function () { mcpState.cat = c[0]; mcpState.page = 0; mcpRender(); };
    catBox.appendChild(el);
  });
  // 网格 + 分页
  var list = mcpFiltered();
  var pages = Math.max(1, Math.ceil(list.length / MCP_PAGE_SIZE));
  if (mcpState.page >= pages) mcpState.page = pages - 1;
  var slice = list.slice(mcpState.page * MCP_PAGE_SIZE, (mcpState.page + 1) * MCP_PAGE_SIZE);
  var grid = document.getElementById('mcpGrid');
  grid.innerHTML = '';
  slice.forEach(function (e) {
    var id = 'minecraft:' + e[0];
    var cell = document.createElement('div');
    cell.className = 'mcp-cell' + (id === mcpState.current ? ' on' : '');
    var ico = document.createElement('div');
    ico.className = 'mcp-ico';
    mcpIconInto(ico, mcpState.kind, e[0]);
    var nm = document.createElement('div');
    nm.className = 'mcp-nm';
    nm.innerHTML = '<b></b><span></span>';
    nm.querySelector('b').textContent = T(e[1], e[2]);
    nm.querySelector('span').textContent = id;
    cell.appendChild(ico); cell.appendChild(nm);
    cell.onclick = function () { mcpChoose(id); };
    grid.appendChild(cell);
  });
  if (!slice.length) {
    grid.innerHTML = '<div style="color:var(--muted);padding:20px;font-size:13px">'
      + T('没有匹配项，可在上方直接输入自定义 ID', 'No match — type a custom ID above') + '</div>';
  }
  document.getElementById('mcpPage').textContent = (mcpState.page + 1) + '/' + pages;
  document.getElementById('mcpPrev').disabled = mcpState.page <= 0;
  document.getElementById('mcpNext').disabled = mcpState.page >= pages - 1;
  document.getElementById('mcpInfo').textContent = T('共 ', 'total ') + list.length;
}

function mcpChoose(id) {
  if (mcpState.cb) mcpState.cb(id);
  mcpClosePicker();
}
function mcpClosePicker() { document.getElementById('mcpMask').classList.remove('show'); }

function openPickerModal(kind, current, cb) {
  mcpState = { kind: kind || 'item', cat: 'all', q: '', page: 0, current: current || '', cb: cb };
  document.getElementById('mcpTitle').textContent =
    kind === 'entity' ? T('选择实体', 'Select Entity') : T('选择物品', 'Select Item');
  // 自动补全清单
  var dl = document.getElementById('mcpDatalist');
  dl.innerHTML = '';
  (kind === 'entity' ? ENTS_RAW : ITEMS_RAW).forEach(function (e) {
    var o = document.createElement('option');
    o.value = 'minecraft:' + e[0];
    o.label = T(e[1], e[2]);
    dl.appendChild(o);
  });
  var search = document.getElementById('mcpSearch');
  search.value = '';
  mcpRender();
  document.getElementById('mcpMask').classList.add('show');
  setTimeout(function () { search.focus(); }, 30);
}

// 选择器事件绑定（元素静态存在于 body 中）
(function bindPicker() {
  var search = document.getElementById('mcpSearch');
  search.addEventListener('input', function () {
    mcpState.q = search.value; mcpState.page = 0; mcpRender();
  });
  search.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') {
      var v = search.value.trim();
      if (v) { mcpChoose(v.indexOf(':') >= 0 ? v : 'minecraft:' + v); }
    }
  });
  document.getElementById('mcpUse').onclick = function () {
    var v = search.value.trim();
    if (v) mcpChoose(v.indexOf(':') >= 0 ? v : 'minecraft:' + v);
  };
  document.getElementById('mcpPrev').onclick = function () { if (mcpState.page > 0) { mcpState.page--; mcpRender(); } };
  document.getElementById('mcpNext').onclick = function () { mcpState.page++; mcpRender(); };
  document.getElementById('mcpClose').onclick = mcpClosePicker;
  document.getElementById('mcpMask').addEventListener('click', function (ev) {
    if (ev.target.id === 'mcpMask') mcpClosePicker();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') mcpClosePicker();
  });
})();

// 攻击/使用：仅“间隔”模式显示间隔字段（单次/持续时隐藏，避免“持续…间隔”歧义）
function defIntervalAction(name, zhVerb, enVerb) {
  Blockly.Blocks[name] = {
    init: function () {
      var self = this;
      this.appendDummyInput('HEAD')
        .appendField(T(zhVerb, enVerb))
        .appendField(new Blockly.FieldDropdown([
          [T('单次', 'once'), 'once'],
          [T('持续', 'continuous'), 'continuous'],
          [T('间隔', 'interval'), 'interval']
        ], function (mode) { self.updateShape_(mode); return mode; }), 'MODE');
      this.appendValueInput('INTERVAL').setCheck('Number').appendField(T('每隔', 'every'));
      this.setInputsInline(true);
      this.setPreviousStatement(true); this.setNextStatement(true);
      this.setColour(C_ACT);
      this.setTooltip(T('单次=点一下；持续=一直按住；间隔=每 N 个 tick 触发一次（仅间隔模式需要填时间）',
        'once=single click; continuous=hold; interval=every N ticks (only interval needs the number)'));
      this.updateShape_(this.getFieldValue('MODE'));
    },
    updateShape_: function (mode) {
      var inp = this.getInput('INTERVAL');
      if (inp) { inp.setVisible(mode === 'interval'); }
      if (this.rendered) this.render();
    }
  };
}

// ==================== 序列化：工作区 → program AST ====================
var errors;
function err(block, msg) { errors.push(msg); if (block) { block.setWarningText(msg); block.select(); } }

function expr(block) {
  if (!block) return null;
  switch (block.type) {
    case 'math_number': return { e: 'num', v: Number(block.getFieldValue('NUM')) || 0 };
    case 'text': return { e: 'str', v: block.getFieldValue('TEXT') || '' };
    case 'logic_boolean': return { e: 'bool', v: block.getFieldValue('BOOL') === 'TRUE' };
    case 'variables_get': return { e: 'var', n: block.getField('VAR').getText() };
    case 'mc_item': case 'mc_item_custom': case 'mc_entity':
      return { e: 'str', v: block.getFieldValue('ID') || '' };
    case 'math_arithmetic': {
      var op = { ADD: '+', MINUS: '-', MULTIPLY: '*', DIVIDE: '/', POWER: 'pow' }[block.getFieldValue('OP')];
      return { e: 'bin', o: op, l: vin(block, 'A'), r: vin(block, 'B') };
    }
    case 'math_single': {
      var sop = { ROOT: 'sqrt', ABS: 'abs', NEG: 'neg' }[block.getFieldValue('OP')];
      if (!sop) { err(block, T('不支持该数学函数（仅 平方根/绝对值/相反数）', 'unsupported math function')); return { e: 'num', v: 0 }; }
      return { e: 'un', o: sop, v: vin(block, 'NUM') };
    }
    case 'math_trig': {
      var top = { SIN: 'sin', COS: 'cos', TAN: 'tan' }[block.getFieldValue('OP')];
      if (!top) { err(block, T('仅支持 sin/cos/tan', 'only sin/cos/tan supported')); return { e: 'num', v: 0 }; }
      return { e: 'sensor', n: top, args: [vin(block, 'NUM')] };
    }
    case 'math_round': {
      var rop = { ROUND: 'round', ROUNDUP: 'ceil', ROUNDDOWN: 'floor' }[block.getFieldValue('OP')];
      return { e: 'un', o: rop, v: vin(block, 'NUM') };
    }
    case 'math_modulo':
      return { e: 'bin', o: '%', l: vin(block, 'DIVIDEND'), r: vin(block, 'DIVISOR') };
    case 'bot_minmax':
      return { e: 'bin', o: block.getFieldValue('OP'), l: vin(block, 'A'), r: vin(block, 'B') };
    case 'math_random_int':
      return { e: 'sensor', n: 'random', args: [vin(block, 'FROM'), vin(block, 'TO')] };
    case 'logic_compare': {
      var cmp = { EQ: '==', NEQ: '!=', LT: '<', LTE: '<=', GT: '>', GTE: '>=' }[block.getFieldValue('OP')];
      return { e: 'bin', o: cmp, l: vin(block, 'A'), r: vin(block, 'B') };
    }
    case 'logic_operation':
      return { e: 'bin', o: block.getFieldValue('OP') === 'AND' ? 'and' : 'or', l: vin(block, 'A'), r: vin(block, 'B') };
    case 'logic_negate': return { e: 'un', o: 'not', v: vin(block, 'BOOL') };
    case 'text_join': {
      var n = block.inputList.filter(function (i) { return i.name && i.name.indexOf('ADD') === 0; }).length;
      var acc = null;
      for (var i = 0; i < n; i++) {
        var piece = vin(block, 'ADD' + i);
        acc = acc === null ? piece : { e: 'bin', o: 'concat', l: acc, r: piece };
      }
      return acc || { e: 'str', v: '' };
    }
    case 'sensor_health': return { e: 'sensor', n: 'health' };
    case 'sensor_food': return { e: 'sensor', n: 'food' };
    case 'sensor_pos': return { e: 'sensor', n: block.getFieldValue('AXIS') };
    case 'sensor_dimension': return { e: 'sensor', n: 'dimension' };
    case 'sensor_held_item': return { e: 'sensor', n: 'heldItem' };
    case 'sensor_inv_count': return { e: 'sensor', n: 'invCount', args: [vin(block, 'ITEM')] };
    case 'sensor_nearby': return { e: 'sensor', n: 'nearbyEntities', args: [vin(block, 'RANGE'), vin(block, 'TYPE')] };
    case 'sensor_container_slots':
      return { e: 'sensor', n: 'containerSlots', args: [vin(block, 'X'), vin(block, 'Y'), vin(block, 'Z')] };
    case 'sensor_container_item':
      return { e: 'sensor', n: 'containerItem', args: [vin(block, 'X'), vin(block, 'Y'), vin(block, 'Z'), vin(block, 'SLOT')] };
    case 'sensor_container_slot_count':
      return { e: 'sensor', n: 'containerSlotCount', args: [vin(block, 'X'), vin(block, 'Y'), vin(block, 'Z'), vin(block, 'SLOT')] };
    case 'sensor_container_count':
      return { e: 'sensor', n: 'containerCount', args: [vin(block, 'X'), vin(block, 'Y'), vin(block, 'Z'), vin(block, 'ITEM')] };
    case 'sensor_is_pathfinding': return { e: 'sensor', n: 'isPathfinding' };
    case 'sensor_time_of_day': return { e: 'sensor', n: 'timeOfDay' };
    // 新增无参传感器（块名 → 函数名）
    case 'sensor_max_health': return { e: 'sensor', n: 'maxHealth' };
    case 'sensor_xp': return { e: 'sensor', n: 'xpLevel' };
    case 'sensor_armor': return { e: 'sensor', n: 'armor' };
    case 'sensor_air': return { e: 'sensor', n: 'air' };
    case 'sensor_on_ground': return { e: 'sensor', n: 'onGround' };
    case 'sensor_in_water': return { e: 'sensor', n: 'inWater' };
    case 'sensor_on_fire': return { e: 'sensor', n: 'onFire' };
    case 'sensor_sneaking': return { e: 'sensor', n: 'sneaking' };
    case 'sensor_is_raining': return { e: 'sensor', n: 'isRaining' };
    case 'sensor_is_day': return { e: 'sensor', n: 'isDay' };
    case 'sensor_bot_name': return { e: 'sensor', n: 'botName' };
    case 'sensor_nearest_player': return { e: 'sensor', n: 'nearestPlayerName' };
    case 'sensor_nearest_player_dist': return { e: 'sensor', n: 'nearestPlayerDistance' };
    case 'sensor_block_at':
      return { e: 'sensor', n: 'blockAt', args: [vin(block, 'X'), vin(block, 'Y'), vin(block, 'Z')] };
    case 'sensor_distance_to':
      return { e: 'sensor', n: 'distanceTo', args: [vin(block, 'X'), vin(block, 'Y'), vin(block, 'Z')] };
    case 'sensor_holding': return { e: 'sensor', n: 'holding', args: [vin(block, 'ITEM')] };
    case 'sensor_has_item': return { e: 'sensor', n: 'hasItem', args: [vin(block, 'ITEM')] };
    case 'sensor_fish_hooked': return { e: 'sensor', n: 'fishHooked' };
    case 'sensor_using_item': return { e: 'sensor', n: 'usingItem' };
    case 'sensor_block_below': return { e: 'sensor', n: 'blockBelow' };
    case 'sensor_facing': return { e: 'sensor', n: 'facing', args: [{ e: 'str', v: block.getFieldValue('AXIS') }] };
    case 'sensor_nearest_entity_pos':
      return { e: 'sensor', n: 'nearestEntityCoord', args: [vin(block, 'RANGE'), vin(block, 'TYPE'), { e: 'str', v: block.getFieldValue('AXIS') }] };
    case 'sensor_nearest_entity_dist':
      return { e: 'sensor', n: 'nearestEntityDistance', args: [vin(block, 'RANGE'), vin(block, 'TYPE')] };
    case 'sensor_nearest_entity_exists':
      return { e: 'sensor', n: 'nearestEntityExists', args: [vin(block, 'RANGE'), vin(block, 'TYPE')] };
    // 文本函数
    case 'str_len': return { e: 'sensor', n: 'strLen', args: [vin(block, 'S')] };
    case 'str_contains': return { e: 'sensor', n: 'strContains', args: [vin(block, 'S'), vin(block, 'SUB')] };
    case 'str_sub': return { e: 'sensor', n: 'strSub', args: [vin(block, 'S'), vin(block, 'FROM'), vin(block, 'TO')] };
    case 'str_char_at': return { e: 'sensor', n: 'strCharAt', args: [vin(block, 'S'), vin(block, 'I')] };
    case 'str_index_of': return { e: 'sensor', n: 'strIndexOf', args: [vin(block, 'S'), vin(block, 'SUB')] };
    case 'str_case': return { e: 'sensor', n: block.getFieldValue('MODE'), args: [vin(block, 'S')] };
    // 列表函数
    case 'list_create': {
      var items = [];
      ['A', 'B', 'C'].forEach(function (k) {
        var v = vin(block, k);
        if (v !== null) items.push(v);
      });
      return { e: 'list', items: items };
    }
    case 'list_get': return { e: 'sensor', n: 'listGet', args: [vin(block, 'LIST'), vin(block, 'INDEX')] };
    case 'list_len': return { e: 'sensor', n: 'listLen', args: [vin(block, 'LIST')] };
    case 'list_contains': return { e: 'sensor', n: 'listContains', args: [vin(block, 'LIST'), vin(block, 'VALUE')] };
    case 'list_index_of': return { e: 'sensor', n: 'listIndexOf', args: [vin(block, 'LIST'), vin(block, 'VALUE')] };
    case 'list_join': return { e: 'sensor', n: 'listJoin', args: [vin(block, 'LIST'), vin(block, 'SEP')] };
    case 'list_split': return { e: 'sensor', n: 'listSplit', args: [vin(block, 'S'), vin(block, 'SEP')] };
    case 'list_random': return { e: 'sensor', n: 'listRandom', args: [vin(block, 'LIST')] };
    case 'list_first': return { e: 'sensor', n: 'listGet', args: [vin(block, 'LIST'), { e: 'num', v: 1 }] };
    case 'list_last': {
      var ll = vin(block, 'LIST');
      return { e: 'sensor', n: 'listGet', args: [ll, { e: 'sensor', n: 'listLen', args: [ll] }] };
    }
    case 'math_constant': {
      var cv = { PI: Math.PI, E: Math.E, GOLDEN_RATIO: (1 + Math.sqrt(5)) / 2, SQRT2: Math.SQRT2, SQRT1_2: Math.SQRT1_2 }[block.getFieldValue('CONSTANT')];
      if (cv === undefined) { err(block, T('不支持该常量', 'unsupported constant')); return { e: 'num', v: 0 }; }
      return { e: 'num', v: cv };
    }
    case 'text_isEmpty':
      return { e: 'bin', o: '==', l: { e: 'sensor', n: 'strLen', args: [vin(block, 'VALUE')] }, r: { e: 'num', v: 0 } };
    default:
      err(block, T('未知表达式积木: ', 'unknown expression block: ') + block.type);
      return { e: 'num', v: 0 };
  }
}

/** 读取值输入（含 shadow），缺失返回 null */
function vin(block, inputName) {
  var target = block.getInputTargetBlock(inputName);
  return target ? expr(target) : null;
}

/** 读取必填值输入，缺失时报错 */
function vreq(block, inputName, label) {
  var v = vin(block, inputName);
  if (v === null) err(block, T('缺少输入: ', 'missing input: ') + label);
  return v === null ? { e: 'num', v: 0 } : v;
}

function stmts(first) {
  var list = [];
  for (var b = first; b; b = b.getNextBlock()) {
    if (b.isShadow()) continue;
    b.setWarningText(null);
    var s = stmt1(b);
    if (s) list.push(s);
  }
  return list;
}

function posArgs(b, s) {
  s.x = vreq(b, 'X', 'x'); s.y = vreq(b, 'Y', 'y'); s.z = vreq(b, 'Z', 'z');
  return s;
}

function stmt1(b) {
  switch (b.type) {
    case 'bot_say': return { op: 'say', text: vreq(b, 'TEXT', 'text') };
    case 'bot_wait': return { op: 'wait', ticks: vreq(b, 'TICKS', 'ticks') };
    case 'bot_wait_until': return { op: 'waitUntil', cond: vreq(b, 'COND', 'condition') };
    case 'bot_broadcast': return { op: 'broadcast', name: b.getFieldValue('NAME') || '' };
    case 'bot_stop_thread': return { op: 'stopThread' };
    case 'bot_equip': return { op: 'equipItem', item: vreq(b, 'ITEM', 'item') };
    case 'bot_drop_of': return { op: 'dropOf', item: vreq(b, 'ITEM', 'item'), count: vreq(b, 'COUNT', 'count') };
    case 'bot_look_entity': return { op: 'lookAtEntity', type: vreq(b, 'TYPE', 'type'), range: vreq(b, 'RANGE', 'range') };
    case 'bot_look_follow': return { op: 'followEntity', type: vreq(b, 'TYPE', 'type'), range: vreq(b, 'RANGE', 'range') };
    case 'bot_stop_look': return { op: 'stopFollow' };
    case 'list_add': return { op: 'listAdd', 'var': b.getField('VAR').getText(), value: vreq(b, 'VALUE', 'value') };
    case 'list_insert': return { op: 'listInsert', 'var': b.getField('VAR').getText(),
      index: vreq(b, 'INDEX', 'index'), value: vreq(b, 'VALUE', 'value') };
    case 'list_remove': return { op: 'listRemove', 'var': b.getField('VAR').getText(), index: vreq(b, 'INDEX', 'index') };
    case 'list_set': return { op: 'listSet', 'var': b.getField('VAR').getText(),
      index: vreq(b, 'INDEX', 'index'), value: vreq(b, 'VALUE', 'value') };
    case 'list_clear': return { op: 'listClear', 'var': b.getField('VAR').getText() };
    case 'text_append': {
      var avn = b.getField('VAR').getText();
      return { op: 'set', 'var': avn,
        value: { e: 'bin', o: 'concat', l: { e: 'var', n: avn }, r: vreq(b, 'TEXT', 'text') } };
    }
    case 'bot_move': {
      var s = { op: 'move', dir: b.getFieldValue('DIR') };
      var t = vin(b, 'TICKS');
      if (t !== null) s.ticks = t;
      return s;
    }
    case 'bot_stop_move': return { op: 'stopMove' };
    case 'bot_jump': return { op: 'jump' };
    case 'bot_sneak': return { op: 'sneak', on: { e: 'bool', v: b.getFieldValue('ON') === 'true' } };
    case 'bot_sprint': return { op: 'sprint', on: { e: 'bool', v: b.getFieldValue('ON') === 'true' } };
    case 'bot_look': return { op: 'look', dir: b.getFieldValue('DIR') };
    case 'bot_look_at': return posArgs(b, { op: 'lookAt' });
    case 'bot_turn': return { op: 'turn', yaw: vreq(b, 'YAW', 'yaw'), pitch: vreq(b, 'PITCH', 'pitch') };
    case 'bot_goto': return posArgs(b, { op: 'goto' });
    case 'bot_goto_stop': return { op: 'gotoStop' };
    case 'bot_attack': {
      var s = { op: 'attack', mode: b.getFieldValue('MODE') };
      if (s.mode === 'interval') s.interval = vreq(b, 'INTERVAL', 'interval');
      return s;
    }
    case 'bot_use': {
      var s = { op: 'use', mode: b.getFieldValue('MODE') };
      if (s.mode === 'interval') s.interval = vreq(b, 'INTERVAL', 'interval');
      return s;
    }
    case 'bot_stop_attack': return { op: 'stopAttack' };
    case 'bot_stop_use': return { op: 'stopUse' };
    case 'bot_slot': return { op: 'slot', n: vreq(b, 'N', 'slot') };
    case 'bot_swap_hands': return { op: 'swapHands' };
    case 'bot_drop': return { op: 'drop', stack: { e: 'bool', v: b.getFieldValue('STACK') === 'true' } };
    case 'bot_mount': return { op: 'mount' };
    case 'bot_dismount': return { op: 'dismount' };
    case 'bot_open_container': return posArgs(b, { op: 'openContainer' });
    case 'bot_close_container': return { op: 'closeContainer' };
    case 'bot_take_container': {
      var s = posArgs(b, { op: 'takeFromContainer' });
      s.item = vreq(b, 'ITEM', 'item'); s.count = vreq(b, 'COUNT', 'count');
      s['var'] = b.getField('VAR').getText();
      return s;
    }
    case 'bot_put_container': {
      var s = posArgs(b, { op: 'putToContainer' });
      s.item = vreq(b, 'ITEM', 'item'); s.count = vreq(b, 'COUNT', 'count');
      s['var'] = b.getField('VAR').getText();
      return s;
    }
    case 'bot_read_container': {
      var s = posArgs(b, { op: 'readContainer' });
      s['var'] = b.getField('VAR').getText();
      return s;
    }
    case 'bot_dump_container': {
      var s = posArgs(b, { op: 'dumpContainer' });
      s.file = b.getFieldValue('FILE'); s.format = b.getFieldValue('FORMAT');
      return s;
    }
    case 'bot_output': return { op: 'output', file: b.getFieldValue('FILE'), format: b.getFieldValue('FORMAT'),
      content: vreq(b, 'CONTENT', 'content'), mode: { e: 'str', v: b.getFieldValue('MODE') } };
    case 'bot_dump_inventory': return { op: 'dumpInventory', file: b.getFieldValue('FILE'),
      format: b.getFieldValue('FORMAT'), mode: { e: 'str', v: b.getFieldValue('MODE') } };
    case 'bot_output_raw': return { op: 'outputRaw', file: b.getFieldValue('FILE'),
      content: vreq(b, 'CONTENT', 'content'), mode: { e: 'str', v: b.getFieldValue('MODE') } };
    case 'bot_output_template': return { op: 'outputTemplate', file: b.getFieldValue('FILE'),
      format: b.getFieldValue('FORMAT'), template: b.getFieldValue('TEMPLATE') || '',
      mode: { e: 'str', v: b.getFieldValue('MODE') } };
    case 'bot_output_table': return { op: 'outputTable', file: b.getFieldValue('FILE'),
      header: vreq(b, 'HEADER', 'header'), row: vreq(b, 'ROW', 'row'),
      mode: { e: 'str', v: b.getFieldValue('MODE') } };
    case 'variables_set': return { op: 'set', 'var': b.getField('VAR').getText(), value: vreq(b, 'VALUE', 'value') };
    case 'math_change': return { op: 'change', 'var': b.getField('VAR').getText(), value: vreq(b, 'DELTA', 'delta') };
    case 'controls_repeat_ext': return { op: 'repeat', times: vreq(b, 'TIMES', 'times'), body: stmts(b.getInputTargetBlock('DO')) };
    case 'controls_whileUntil': {
      var cond = vreq(b, 'BOOL', 'condition');
      if (b.getFieldValue('MODE') === 'UNTIL') cond = { e: 'un', o: 'not', v: cond };
      return { op: 'while', cond: cond, body: stmts(b.getInputTargetBlock('DO')) };
    }
    case 'bot_forever': return { op: 'forever', body: stmts(b.getInputTargetBlock('DO')) };
    case 'controls_if': return convertIf(b, 0);
    case 'bot_stop_self': return { op: 'stopSelf' };
    case 'bot_stop_all': return { op: 'stopAll' };
    case 'procedures_defnoreturn': {
      var def = b.getProcedureDef(); // [名称, 参数名数组, 是否有返回值]
      return { op: 'def', name: def[0], params: def[1].join(','),
        body: stmts(b.getInputTargetBlock('STACK')) };
    }
    case 'procedures_callnoreturn': {
      var s = { op: 'call', name: b.getFieldValue('NAME') };
      var argCount = (b.arguments_ || []).length;
      for (var i = 0; i < argCount; i++) {
        s['arg' + i] = vreq(b, 'ARG' + i, T('参数', 'argument ') + i);
      }
      return s;
    }
    case 'procedures_defreturn': case 'procedures_callreturn': case 'procedures_ifreturn':
      err(b, T('暂不支持带返回值的函数，请用普通函数 + 变量传递结果', 'functions with return are not supported yet'));
      return null;
    default:
      err(b, T('未知语句积木: ', 'unknown statement block: ') + b.type);
      return null;
  }
}

/** controls_if 的 IF0/IF1/... 链转为嵌套 if/else */
function convertIf(b, idx) {
  var s = { op: 'if', cond: vreq(b, 'IF' + idx, 'condition'), then: stmts(b.getInputTargetBlock('DO' + idx)) };
  if (b.getInput('IF' + (idx + 1))) {
    s['else'] = [convertIf(b, idx + 1)];
  } else if (b.getInput('ELSE')) {
    s['else'] = stmts(b.getInputTargetBlock('ELSE'));
  }
  return s;
}

function serialize() {
  errors = [];
  var tops = workspace.getTopBlocks(true).filter(function (b) { return !b.isShadow(); });
  var program = [];
  tops.forEach(function (t) {
    // 帽子块：本体为其后继链
    if (t.type === 'event_start') {
      t.setWarningText(null);
      program.push({ op: 'onStart', body: stmts(t.getNextBlock()) });
    } else if (t.type === 'event_chat') {
      t.setWarningText(null);
      program.push({ op: 'onChat', text: { e: 'str', v: t.getFieldValue('TEXT') || '' },
        body: stmts(t.getNextBlock()) });
    } else if (t.type === 'event_broadcast') {
      t.setWarningText(null);
      program.push({ op: 'onBroadcast', name: t.getFieldValue('NAME') || '',
        body: stmts(t.getNextBlock()) });
    } else if (t.type === 'event_health') {
      t.setWarningText(null);
      program.push({ op: 'onHealthBelow', value: Number(t.getFieldValue('VALUE')) || 10,
        body: stmts(t.getNextBlock()) });
    } else if (t.type === 'event_entity') {
      t.setWarningText(null);
      program.push({ op: 'onEntityNear', range: Number(t.getFieldValue('RANGE')) || 8,
        type: t.getFieldValue('TYPE') || '', body: stmts(t.getNextBlock()) });
    } else {
      program = program.concat(stmts(t));
    }
  });
  return { program: program, errors: errors };
}

// ==================== 顶栏交互 ====================
function $(id) { return document.getElementById(id); }

function currentFileName() {
  var n = ($('bhName').value || 'behavior').trim();
  return n.replace(/[\\/:*?"<>|]/g, '_') + '.json';
}

/** 校验并构建导出数据 @return 数据对象；校验失败返回 null（已提示） */
function buildExportData() {
  var result = serialize();
  if (result.errors.length > 0) {
    status(T('无法保存，存在 ' + result.errors.length + ' 个问题：', 'cannot save: ') + result.errors[0], 'err');
    return null;
  }
  if (result.program.length === 0) {
    status(T('无法保存：工作区为空', 'cannot save: workspace is empty'), 'err');
    return null;
  }
  return {
    format: 1,
    name: $('bhName').value || 'behavior',
    description: $('bhDesc').value || '',
    loop: false, // 循环语义由"永远重复"积木与事件帽子块表达
    program: result.program,
    blockly: Blockly.serialization.workspaces.save(workspace)
  };
}

$('btnSave').onclick = function () {
  var data = buildExportData();
  if (!data) return;
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = currentFileName();
  a.click();
  URL.revokeObjectURL(a.href);
  status(T('已保存 ' + a.download + ' — 放入 config/my-bot-mod/behaviors/ 后在游戏内重扫即可',
    'saved ' + a.download + ' - drop into config/my-bot-mod/behaviors/ and rescan in game'), 'ok');
};

// 保存到任意文件夹（File System Access API，会话内记忆所选目录；不支持的浏览器回退提示）
var exportDirHandle = null;
$('btnSaveDir').onclick = async function () {
  var data = buildExportData();
  if (!data) return;
  if (!window.showDirectoryPicker) {
    status(T('当前浏览器不支持选择文件夹，请用下载保存后手动放入目标文件夹',
      'folder picker unsupported; use download save and move the file manually'), 'err');
    return;
  }
  try {
    if (!exportDirHandle) {
      exportDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    }
    var fileName = currentFileName();
    var fileHandle = await exportDirHandle.getFileHandle(fileName, { create: true });
    var writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(data, null, 2));
    await writable.close();
    status(T('已直接写入 ' + exportDirHandle.name + '/' + fileName,
      'written to ' + exportDirHandle.name + '/' + fileName), 'ok');
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    exportDirHandle = null;
    status(T('保存失败：', 'save failed: ') + (e && e.message ? e.message : e), 'err');
  }
};

$('btnOpen').onclick = function () { $('fileInput').click(); };
$('fileInput').onchange = function (ev) {
  var file = ev.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var data = JSON.parse(reader.result);
      if (!data.blockly) {
        status(T('该文件缺少编辑器数据（blockly 字段），无法回读', 'file has no editor data (blockly field)'), 'err');
        return;
      }
      Blockly.serialization.workspaces.load(data.blockly, workspace);
      $('bhName').value = data.name || '';
      $('bhDesc').value = data.description || '';
      status(T('已打开 ', 'opened ') + file.name, 'ok');
    } catch (e) {
      status(T('打开失败: ', 'open failed: ') + e.message, 'err');
    }
    ev.target.value = '';
  };
  reader.readAsText(file, 'utf-8');
};

$('btnNew').onclick = function () {
  if (workspace.getAllBlocks(false).length > 0
      && !confirm(T('清空当前工作区？（已删积木可从回收站找回）', 'Clear the workspace?'))) {
    return;
  }
  workspace.clear();
  $('bhName').value = ''; $('bhDesc').value = '';
  status(T('已新建', 'new workspace'), 'ok');
};

$('btnUndo').onclick = function () { workspace.undo(false); };
$('btnRedo').onclick = function () { workspace.undo(true); };
$('btnCenter').onclick = function () { workspace.scrollCenter(); workspace.setScale(0.75); };

$('btnLang').textContent = LANG === 'zh' ? 'EN' : '中文';
$('btnLang').onclick = function () {
  localStorage.setItem('bh_lang', LANG === 'zh' ? 'en' : 'zh');
  location.reload();
};

// 顶栏文案本地化
$('lbName').textContent = T('行为名', 'NAME');
$('lbDesc').textContent = T('描述', 'DESCRIPTION');
$('lbSave').textContent = T('保存', 'Save');
$('btnUndo').setAttribute('data-tip', T('撤销 Ctrl+Z', 'Undo Ctrl+Z'));
$('btnRedo').setAttribute('data-tip', T('重做 Ctrl+Y', 'Redo Ctrl+Y'));
$('btnCenter').setAttribute('data-tip', T('居中视图', 'Center view'));
$('btnNew').setAttribute('data-tip', T('新建', 'New'));
$('btnOpen').setAttribute('data-tip', T('打开 .json', 'Open .json'));

// ==================== 自动草稿与块计数 ====================
var draftTimer = null;
function updateCount() {
  var n = workspace.getAllBlocks(false).filter(function (b) { return !b.isShadow(); }).length;
  $('blockCount').textContent = T(n + ' 积木', n + ' blocks');
}
workspace.addChangeListener(function (e) {
  if (e.isUiEvent) return;
  updateCount();
  clearTimeout(draftTimer);
  draftTimer = setTimeout(function () {
    try {
      localStorage.setItem('bh_draft', JSON.stringify({
        name: $('bhName').value, desc: $('bhDesc').value,
        blockly: Blockly.serialization.workspaces.save(workspace)
      }));
    } catch (ignored) { }
  }, 800);
});
(function restoreDraft() {
  try {
    var draft = JSON.parse(localStorage.getItem('bh_draft') || 'null');
    if (draft && draft.blockly) {
      Blockly.serialization.workspaces.load(draft.blockly, workspace);
      $('bhName').value = draft.name || '';
      $('bhDesc').value = draft.desc || '';
      status(T('已恢复上次的草稿', 'restored previous draft'), '');
    }
  } catch (ignored) { }
  updateCount();
})();

window.addEventListener('resize', function () { Blockly.svgResize(workspace); });
</script>
